<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>غير متصل — FX Partners</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background:
      radial-gradient(120% 120% at 100% 0%, rgba(37,99,235,.35), rgba(6,15,30,0) 60%),
      radial-gradient(120% 120% at 0% 100%, rgba(34,211,238,.25), rgba(6,15,30,0) 60%),
      #060f1e;
    color: #e2e8f0; text-align: center; padding: 24px;
  }
  .card {
    max-width: 420px; padding: 40px 28px;
    border: 1px solid rgba(255,255,255,.08); border-radius: 20px;
    background: rgba(10,23,40,.6); backdrop-filter: blur(8px);
  }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  .logo b { color: #22d3ee; }
  h1 { font-size: 22px; margin: 20px 0 8px; }
  p { color: #94a3b8; line-height: 1.8; margin: 0 0 24px; font-size: 14px; }
  button {
    border: 0; cursor: pointer; font: inherit; font-weight: 700;
    color: #fff; padding: 12px 26px; border-radius: 12px;
    background: linear-gradient(90deg, #2563eb, #22d3ee);
    box-shadow: 0 8px 30px rgba(34,211,238,.25);
  }
  .icon { font-size: 44px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div class="logo" style="margin-top:14px"><b>FX</b> Partners</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصالك بالإنترنت مقطوع. تحقّق من الشبكة ثم أعد المحاولة — بعض الصفحات التي زرتها سابقاً قد تعمل دون اتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
