name: Supabase — apply migrations & deploy functions

# Runs against the PRODUCTION database. It only fires for pushes to the
# default branch (forks cannot trigger it) and only when something under
# supabase/ actually changed, so ordinary code pushes don't touch the DB.
on:
  push:
    branches: [claude/fx-partners-website-oit635]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/supabase.yml"
  # Manual run, with an opt-in for the seed files. Migrations always apply;
  # the seeds only run when you ask, because they are content, not schema —
  # and running them is the one job that otherwise means opening the SQL
  # editor and pasting by hand.
  workflow_dispatch:
    inputs:
      run_seeds:
        description: "Also run supabase/seed.sql and seed_forum.sql"
        type: boolean
        default: false

# Never let two deploys race against the same database.
concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply to production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The first five runs of this workflow all failed here, in twelve seconds,
      # because none of the three secrets was ever set. A bare "missing secret
      # X" leaves you to go and find out what X is and where it comes from, so
      # the message says it.
      - name: Fail early if the secrets are missing
        id: secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::missing repository secret SUPABASE_ACCESS_TOKEN — create one at https://supabase.com/dashboard/account/tokens (it starts sbp_)"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::missing repository secret SUPABASE_DB_PASSWORD — Supabase → Project Settings → Database → Database password (reset it there if you no longer have it)"
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::missing repository secret SUPABASE_PROJECT_ID — the project ref, i.e. the subdomain of your project URL: https://<this-part>.supabase.co"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::notice::Add them under Settings → Secrets and variables → Actions → New repository secret, then re-run this workflow."
            exit 1
          fi

      - name: Ensure a CLI project config exists
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --force
          fi

      - name: Link to the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Printed before anything is applied, so the run log always shows which
      # migrations the remote already had — the first thing to look at when a
      # push fails with "already exists".
      - name: Migration state before applying
        run: supabase migration list --linked

      - name: Apply pending migrations
        run: supabase db push

      # Guarded on the secrets check: unguarded, `always()` meant a run that
      # failed for a missing secret also printed "Cannot find project ref",
      # burying the actual cause under a second, unrelated error.
      - name: Migration state after applying
        if: always() && steps.secrets.outcome == 'success'
        run: supabase migration list --linked

      # Both seed files are safe to run repeatedly: the broker seed upserts by
      # slug, and the forum seed refuses to run at all until an admin account
      # exists, with a message saying why.
      #
      # This uses an explicit connection string rather than deriving the pooler
      # host from the project ref — that derivation differs by region and would
      # fail in a way that looks like a database problem. Copy it from
      # Supabase → Project Settings → Database → Connection string (URI), and
      # store it as the SUPABASE_DB_URL secret.
      - name: Run seeds
        if: inputs.run_seeds
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # psql treats its first argument as a *database name* — and connects
          # to a local socket — unless the value is recognisably a connection
          # URI. The commonest reason a correct-looking secret still hits the
          # local socket is a wrapping pair of quotes or a stray newline stored
          # with it, so trim those before anything else.
          url="${SUPABASE_DB_URL:-}"
          url="$(printf '%s' "$url" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          url="${url%\"}"; url="${url#\"}"
          url="${url%\'}"; url="${url#\'}"

          if [ -z "$url" ]; then
            echo "::error::seeds requested but the SUPABASE_DB_URL secret is empty"
            exit 1
          fi
          case "$url" in
            postgresql://*|postgres://*) : ;;
            *)
              echo "::error::SUPABASE_DB_URL is not a connection URI — it must start with postgresql://. Copy the URI tab of Supabase → Project Settings → Database → Connection string. (yours begins: '$(printf '%.13s' "$url")')"
              exit 1 ;;
          esac

          # Do NOT feed the whole URI to psql. A database password routinely
          # contains characters that are special inside a URI (@ : / ? # [ ])
          # and, left un-encoded, make libpq misread the host and fall back to a
          # local socket — the "connection to server on socket …" failure seen
          # on runs 10–14, where a '@' in the password split the authority in
          # the wrong place. So parse the URI by structure and take the password
          # from its own secret, passed literally through PGPASSWORD and never
          # parsed. SUPABASE_DB_PASSWORD is the same secret the migration step
          # already authenticated with, so it is guaranteed consistent.
          rest="${url#*://}"              # user:pass@host:port/db?params
          hostportdb="${rest##*@}"        # host:port/db?params (last @ = real delimiter)
          userinfo="${rest%@*}"           # user:pass (everything before the last @)
          user="${userinfo%%:*}"          # user
          hostport="${hostportdb%%/*}"    # host:port
          dbpart="${hostportdb#*/}"       # db?params (or host:port when no slash)
          [ "$dbpart" = "$hostportdb" ] && dbpart="postgres"
          db="${dbpart%%\?*}"; db="${db:-postgres}"
          host="${hostport%%:*}"
          port="${hostport#*:}"; { [ "$port" = "$hostport" ] || [ -z "$port" ]; } && port=5432

          # Prefer the dedicated password secret; fall back to whatever the URI
          # carried only if that secret is unset.
          pass="${SUPABASE_DB_PASSWORD:-}"
          [ -n "$pass" ] || pass="${userinfo#*:}"
          if [ -z "$pass" ] || [ "$pass" = "$userinfo" ]; then
            echo "::error::no database password available — set the SUPABASE_DB_PASSWORD secret (Supabase → Project Settings → Database → Database password)."
            exit 1
          fi
          case "$pass" in
            '[YOUR-PASSWORD]'|'[your-password]'|'%5BYOUR-PASSWORD%5D')
              echo "::error::the database password is still the literal [YOUR-PASSWORD] placeholder — set the real password in the SUPABASE_DB_PASSWORD secret."
              exit 1 ;;
          esac

          # GitHub's hosted runners are IPv4-only; Supabase's *direct* endpoint
          # (db.<ref>.supabase.co) is IPv6-only, so it cannot be reached from
          # here even with correct credentials. The pooler host is IPv4-capable.
          case "$host" in
            db.*.supabase.co)
              echo "::warning::$host is the direct (IPv6-only) endpoint, which GitHub's IPv4 runners cannot reach. If this step fails to connect, copy the *Session pooler* connection string instead (host aws-0-<region>.pooler.supabase.com, user postgres.<ref>) into the SUPABASE_DB_URL secret." ;;
          esac

          echo "→ connecting to $host:$port/$db as $user"
          command -v psql >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }
          for f in supabase/seed.sql supabase/seed_external_brokers.sql supabase/seed_blog.sql supabase/seed_blog_reviews.sql supabase/seed_forum.sql; do
            [ -f "$f" ] || continue
            echo "→ $f"
            PGPASSWORD="$pass" psql -h "$host" -p "$port" -U "$user" -d "$db" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Deploy edge functions
        run: |
          shopt -s nullglob
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in _*) continue ;; esac
            echo "→ deploying $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID"
          done
